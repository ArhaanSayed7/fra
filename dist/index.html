<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Fortnite Racing Association — Find your racing line.</title>
    <meta
      name="description"
      content="Your home for community Fortnite racing. Explore events, compete in time trials, and find your racing line."
    />
    <link rel="icon" href="assets/fra-logo.png" />
    <link rel="stylesheet" href="assets/fonts.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="modern.css" />
  </head>
  <body class="booting">
    <div
      id="boot-screen"
      class="boot-screen"
      role="status"
      aria-live="polite"
      aria-label="Loading Fortnite Racing Association"
    >
      <div class="boot-grid"></div>
      <div class="boot-halo"></div>
      <div class="boot-content">
        <span class="boot-eyebrow">FORTNITE RACING ASSOCIATION</span
        ><img src="assets/fra-logo.png" alt="FRA" width="110" height="110" />
        <div class="boot-title">
          LIGHTS OUT<span>START YOUR NEXT CHAPTER.</span>
        </div>
        <div class="boot-lights" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="boot-progress"><span></span></div>
        <span class="boot-status">PREPARING THE GRID</span>
      </div>
      <div class="boot-footer">
        FRA / RACING TOGETHER<span>EST. COMMUNITY</span>
      </div>
    </div>
    <header id="header" inert></header>
    <main id="app" inert></main>
    <footer id="footer" inert></footer>
    <dialog id="modal"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="config.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
